{% extends "base.html" %}

{% block title %}Administrator Login — SmartHealth AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-modern p-4 p-md-5 border-top border-4 border-dark">
                <div class="text-center mb-4">
                    <div class="p-3 bg-dark text-white rounded-circle d-inline-block mb-3">
                        <i class="fa-solid fa-user-shield fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Admin Access Portal</h3>
                    <p class="text-muted fs-7">Administrative login for system monitoring & ML management</p>
                </div>

                <form method="POST" action="{{ url_for('auth.admin_login') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold fs-7">Administrator Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-shield-halved text-muted"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="admin@smarthealth.ai" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold fs-7">Admin Key / Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2 mb-3">
                        <i class="fa-solid fa-lock me-2"></i> Authorize Admin Session
                    </button>

                    <div class="text-center fs-7 text-secondary">
                        Return to <a href="{{ url_for('main.index') }}" class="text-secondary text-decoration-underline">Public Portal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
