{% extends "base.html" %}

{% block title %}Patient Login — SmartHealth AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-modern p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="p-3 bg-primary-subtle text-primary rounded-circle d-inline-block mb-3">
                        <i class="fa-solid fa-user-check fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Patient Sign In</h3>
                    <p class="text-muted fs-7">Enter your account credentials to access your health portal</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold fs-7">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-regular fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold fs-7">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4 fs-7">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="remember" id="rememberCheck" checked>
                            <label class="form-check-label text-secondary" for="rememberCheck">
                                Remember me
                            </label>
                        </div>
                        <a href="#" onclick="alert('Password reset link has been dispatched to your email if registered.'); return false;" class="text-primary text-decoration-none">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 mb-3">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                    </button>

                    <div class="text-center fs-7 text-secondary">
                        Don't have a patient account? <a href="{{ url_for('auth.signup') }}" class="text-primary fw-semibold text-decoration-none">Register here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
